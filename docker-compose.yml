services:
  calculator:
    image: vishnu933/calculator-devops:${IMAGE_TAG:-latest }
    
    environment:
      SERVER_PORT: 8080
    
    expose: 
      - "8080"

    networks:
      - calculator-network

    restart : unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | 
        grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      calculator:
        condition: service_healthy

    networks:
      - calculator-network

    restart: unless-stopped

networks:
  calculator-network:
    driver: bridge